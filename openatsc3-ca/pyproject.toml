[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openatsc3-ca"
version = "0.1.0"
description = "OpenATSC3 CA operator application: Django + PostgreSQL ledger over the openatsc3-pki toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenATSC3", email = "openatsc3@example.com"}
]
dependencies = [
    "openatsc3-pki>=0.1,<0.2",
    "django>=5.1,<6",
    "psycopg[binary]>=3.1",
    "whitenoise>=6",
]

[project.optional-dependencies]
# Production WSGI server (the container entrypoint runs gunicorn).
prod = [
    "gunicorn>=21",
]
# Rootless embedded PostgreSQL for tests / local dev without Docker.  The
# pgserver wheel is 3.12-only, so run the test suite on Python 3.12.
test = [
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.1",
    "pytest>=7.0",
    "pytest-django>=4.8",
]
# Non-exportable KMS asymmetric keys for online private keys (production).
kms = [
    "openatsc3-pki[kms]",
]
# Stripe Checkout for sales.
stripe = [
    "stripe>=7",
]
# S3 artifact delivery (signed URLs).
aws = [
    "boto3>=1.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openatsc3_ca*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "openatsc3_ca.settings"
testpaths = ["tests"]

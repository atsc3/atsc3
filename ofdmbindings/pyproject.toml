[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "ofdmbindings"
version = "0.1.0"
description = "Compiled OFDM kernels (ATSC 3.0 frequency interleaver)"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["ofdmbindings"]

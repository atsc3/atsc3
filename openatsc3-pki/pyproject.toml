[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openatsc3-pki"
dynamic = ["version"]
description = "OpenATSC3 certificate authority and content-protection toolkit (ATSC A/360 profiles)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenATSC3", email = "openatsc3@example.com"}
]
dependencies = [
    "cryptography>=42.0",
    "asn1crypto>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
kms = [
    "boto3>=1.28",
]

[project.scripts]
openatsc3-pki = "openatsc3_pki.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openatsc3_pki*"]

[tool.setuptools_scm]
root = ".."
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

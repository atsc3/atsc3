[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openatsc3-pki"
version = "0.1.0"
description = "OpenATSC3 certificate authority and content-protection toolkit (ATSC A/360 profiles)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenATSC3", email = "openatsc3@example.com"}
]
dependencies = [
    "cryptography>=42.0",
    "asn1crypto>=1.5",
]

[project.optional-dependencies]
# The Django + PostgreSQL CA management app (Gap A closure).  This is the
# operator/system-of-record layer; the crypto library above needs none of it.
web = [
    "django>=5.1,<6",
    "psycopg[binary]>=3.1",
]
# Rootless embedded PostgreSQL for tests / local dev without Docker.  3.12 only.
test-ca = [
    "pgserver>=0.1.4",
    "psycopg[binary]>=3.1",
    "pytest>=7.0",
    "pytest-django>=4.8",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
openatsc3-pki = "openatsc3_pki.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openatsc3_pki*", "openatsc3_ca*", "catalog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

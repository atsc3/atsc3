[project]
name = "atsc3-workspace"
version = "0.0.0"
description = "ATSC 3.0 receiver workspace: atsc3lib, compiled bindings, and the openatsc3 PKI toolkit"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}

[tool.uv.workspace]
members = [
    "atsc3lib",
    "sdrbindings",
    "ac4bindings",
    "openatsc3-pki",
    "openatsc3-ca",
]

[tool.uv.sources]
atsc3lib = { workspace = true }
sdrbindings = { workspace = true }
ac4bindings = { workspace = true }
openatsc3-pki = { workspace = true }
openatsc3-ca = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["atsc3lib/tests"]
# atsc3lib's tests import the sibling `tools` package (`from tools import ...`),
# so `atsc3lib/` must be importable when pytest runs from the monorepo root.
pythonpath = ["atsc3lib"]

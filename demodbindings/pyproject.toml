[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "demodbindings"
version = "0.1.0"
description = "Compiled soft-demodulation kernels (ATSC 3.0 max-log demapper)"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["demodbindings"]

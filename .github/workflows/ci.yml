name: CI

# One workspace, one workflow.  GitHub only reads workflows from the repo
# root /.github/workflows/, so every package's suite is driven from here.
# Runs on every push (branches and tags), pull request and tag.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: atsc3lib,    target: test,     sync: "uv sync --package atsc3lib --extra pki --group dev" }
          - { package: ac4bindings, target: test-ac4, sync: "uv sync --package ac4bindings --group dev" }
          - { package: sdrbindings, target: test-sdr, sync: "uv sync --package sdrbindings --group dev" }
    steps:
      - uses: actions/checkout@v4

      # atsc3lib hard-depends on sdrbindings, so both jobs need the SoapySDR
      # headers to compile it; ac4bindings is standalone.
      - name: System dependencies (SoapySDR)
        if: matrix.package == 'sdrbindings' || matrix.package == 'atsc3lib'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Each package is a first-class workspace member, so the sync is scoped to
      # just what that package's suite needs.  (atsc3lib also pulls the light
      # openatsc3-pki library via its [pki] extra; the Django app is never
      # installed here.)
      - name: Sync ${{ matrix.package }}
        run: ${{ matrix.sync }}

      - name: Test ${{ matrix.package }}
        run: make ${{ matrix.target }}

  test-pki:
    name: openatsc3-pki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Scope the sync to the pki package: it has no dependency on the
      # compiled bindings, so this avoids building sdrbindings (which needs
      # SoapySDR headers) while still installing pytest for the suite.
      - name: Sync openatsc3-pki
        run: uv sync --package openatsc3-pki --group dev

      - name: Test openatsc3-pki
        run: make test-pki

  docs:
    name: docs (Sphinx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (SoapySDR for the sdrbindings dep)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The docs autodoc atsc3lib, so the sync pulls atsc3lib's compiled
      # kernels plus the docs group, then builds with warnings as errors.
      - name: Build documentation
        run: |
          uv sync --package atsc3lib --extra pki --group dev --group docs
          uv run --no-sync python -m sphinx -b html -W docs docs/_build/html

  test-ca:
    name: openatsc3-ca (Django + PostgreSQL CA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The CA app lives in openatsc3-ca and depends on openatsc3-pki.  Its test
      # extra pulls pgserver, a rootless embedded PostgreSQL (16.2) that runs as
      # the runner user, so no service container and no Docker are needed.
      - name: Create CA environment and install extras
        run: |
          uv venv --python 3.12 .venv-ca
          uv pip install --python .venv-ca/bin/python -e './openatsc3-ca[test]'

      - name: Test CA app
        run: make -C openatsc3-ca test PYTHON="$PWD/.venv-ca/bin/python"

name: CI

# One workspace, one workflow.  GitHub only reads workflows from the repo
# root /.github/workflows/, so every package's suite is driven from here.
# Runs on every push (branches and tags), pull request and tag.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: atsc3lib,      target: test }
          - { package: ac4bindings,   target: test-ac4 }
          - { package: sdrbindings,   target: test-sdr }
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (SoapySDR for sdrbindings)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev pkg-config

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace (all packages, editable)
        run: uv sync --all-packages

      - name: Test ${{ matrix.package }}
        run: make ${{ matrix.target }}

  test-pki:
    name: openatsc3-pki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Scope the sync to the pki package: it has no dependency on the
      # compiled bindings, so this avoids building sdrbindings (which needs
      # SoapySDR headers) while still installing pytest for the suite.
      - name: Sync openatsc3-pki
        run: uv sync --package openatsc3-pki --group dev

      - name: Test openatsc3-pki
        run: make test-pki

  test-ca:
    name: openatsc3-pki (Django + PostgreSQL CA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The CA app is an optional extra.  pgserver ships a rootless embedded
      # PostgreSQL (16.2) that runs as the runner user, so no service container
      # and no Docker are needed in CI.
      - name: Create CA environment and install extras
        run: |
          uv venv --python 3.12 .venv-ca
          uv pip install --python .venv-ca/bin/python -e './openatsc3-pki[web,test-ca]'

      - name: Test CA app
        run: make -C openatsc3-pki test-ca CA_PYTHON="$PWD/.venv-ca/bin/python"

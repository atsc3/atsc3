[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "ac4bindings"
version = "0.1.0"
description = "Compiled AC-4 (ETSI TS 103 190) decoder kernels for atsc3lib"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["ac4bindings"]

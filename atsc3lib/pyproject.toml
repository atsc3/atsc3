[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "atsc3lib"
version = "0.1.0"
description = "ATSC 3.0 Physical Layer Demodulation Library"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenATSC3", email = "openatsc3@example.com"}
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.5",
    "sdrbindings>=0.1,<0.2",
    "ac4bindings>=0.1,<0.2",
    "av>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
# Own-CA signed-signaling verification (greenfield PKI track).  Optional: the
# receiver works without it and the RF33 lighthouse carries no signatures.
pki = [
    "openatsc3-pki>=0.1,<0.2",
]

[project.scripts]
atsc3-decode = "atsc3lib.cli:decode_main"
atsc3-live = "atsc3lib.cli:live_main"
atsc3-media = "atsc3lib.cli:media_main"
atsc3-capture = "atsc3lib.capture:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atsc3lib*"]

